# Wavin AHC-9000 - Standby Mode Example
# This example demonstrates the OFF/Standby feature of the climate entity

substitutions:
  device_name: wavin-heating-standby
  friendly_name: Wavin Standby Example

esphome:
  name: ${device_name}

esp32:
  board: esp32dev

# Enable logging
logger:
  level: DEBUG  # Use DEBUG to see mode changes

# Enable Home Assistant API
api:

# Enable OTA updates
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  ap:
    ssid: "${friendly_name} Hotspot"
    password: "fallback123"

captive_portal:

# Load the custom component
external_components:
  - source: github://jascdk/esphome_wavinahc9000v4
    components: [wavin_ahc9000]

# Configure UART for RS485
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN

# Configure time for clock sync
time:
  - platform: homeassistant
    id: ha_time

# Configure the Wavin AHC-9000 component
wavin_ahc9000:
  id: wavin_controller
  uart_id: uart_bus
  update_interval: 5s
  tx_enable_pin: GPIO5
  flow_control_pin: GPIO5
  time_id: ha_time
  sync_clock_on_connect: true

# Climate entities for multiple zones
climate:
  # Zone 1 - Living Room
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Living Room"
    id: living_room_climate
    channel: 1
    # When set to OFF in Home Assistant, the thermostat enters standby mode
    # When set to HEAT, it returns to manual mode with the set temperature

  # Zone 2 - Bedroom
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Bedroom"
    id: bedroom_climate
    channel: 2

# Automation examples using standby mode
# These would be added to your Home Assistant configuration

# Example 1: Turn off heating when nobody is home
# automation:
#   - alias: "Turn off heating when away"
#     trigger:
#       - platform: state
#         entity_id: binary_sensor.home_occupied
#         to: "off"
#         for: "00:30:00"  # 30 minutes
#     action:
#       - service: climate.set_hvac_mode
#         target:
#           entity_id: 
#             - climate.living_room
#             - climate.bedroom
#         data:
#           hvac_mode: "off"  # Enters standby mode

# Example 2: Turn heating back on when someone arrives home
# automation:
#   - alias: "Turn on heating when home"
#     trigger:
#       - platform: state
#         entity_id: binary_sensor.home_occupied
#         to: "on"
#     action:
#       - service: climate.set_hvac_mode
#         target:
#           entity_id:
#             - climate.living_room
#             - climate.bedroom
#         data:
#           hvac_mode: "heat"  # Returns to manual mode with previous temperature

# Example 3: Night mode - turn off heating in living room
# automation:
#   - alias: "Night mode - living room off"
#     trigger:
#       - platform: time
#         at: "23:00:00"
#     action:
#       - service: climate.set_hvac_mode
#         target:
#           entity_id: climate.living_room
#         data:
#           hvac_mode: "off"

#   - alias: "Morning mode - living room on"
#     trigger:
#       - platform: time
#         at: "06:00:00"
#     action:
#       - service: climate.set_hvac_mode
#         target:
#           entity_id: climate.living_room
#         data:
#           hvac_mode: "heat"

# Sensor to monitor temperature
sensor:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: temperature
    name: "Living Room Temperature"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 2
    type: temperature
    name: "Bedroom Temperature"

# Optional: Monitor battery levels for wireless thermostats
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: battery
    name: "Living Room Battery"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 2
    type: battery
    name: "Bedroom Battery"
