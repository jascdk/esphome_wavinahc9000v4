# Wavin AHC-9000 Humidity Sensor Test Configuration
# This example tests if room thermostats can read humidity

substitutions:
  device_name: wavin-humidity-test
  friendly_name: Wavin Humidity Test

esphome:
  name: ${device_name}

esp32:
  board: esp32dev

# Enable logging with DEBUG level to see humidity values
logger:
  level: DEBUG

# Enable Home Assistant API
api:

# Enable OTA updates
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot in case wifi connection fails
  ap:
    ssid: "${friendly_name} Hotspot"
    password: "fallback123"

captive_portal:

# Load the custom component from GitHub
external_components:
  - source: github://jascdk/esphome_wavinahc9000v4
    components: [wavin_ahc9000]

# Configure UART for RS485 communication
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN

# Configure the Wavin AHC-9000 component
wavin_ahc9000:
  id: wavin_controller
  uart_id: uart_bus
  update_interval: 5s
  # RS485 control pins
  tx_enable_pin: GPIO5
  flow_control_pin: GPIO5

# Climate entity for zone 1
climate:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Zone 1"
    channel: 1

# Sensors to test humidity reading
sensor:
  # Room temperature sensor for comparison
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: temperature
    name: "Zone 1 Temperature"
  
  # HUMIDITY SENSOR - Testing if thermostats can read humidity
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: humidity
    name: "Zone 1 Humidity"
  
  # Battery level for reference
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: battery
    name: "Zone 1 Battery"

  # Test on multiple channels to see if humidity is available
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 2
    type: temperature
    name: "Zone 2 Temperature"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 2
    type: humidity
    name: "Zone 2 Humidity"
