# Test Configuration - External Components Usage
# This file demonstrates how to use the Wavin AHC-9000 component via external_components

esphome:
  name: test-wavin

esp32:
  board: esp32dev
  framework:
    type: arduino

# Reference the component from GitHub
external_components:
  - source: github://jascdk/esphome_wavinahc9000v4
    components: [wavin_ahc9000]

# Or use a specific branch/tag:
# external_components:
#   - source: github://jascdk/esphome_wavinahc9000v4@main
#     components: [wavin_ahc9000]

# Or reference a local directory for development:
# external_components:
#   - source:
#       type: local
#       path: /path/to/esphome_wavinahc9000v4
#     components: [wavin_ahc9000]

logger:

api:

ota:
  platform: esphome

wifi:
  ssid: "test"
  password: "testpassword"

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN

wavin_ahc9000:
  id: wavin_controller
  uart_id: uart_bus
  tx_enable_pin: GPIO5

climate:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Test Zone"
    channel: 1

text_sensor:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: control_unit_address
    name: "Control Unit Address"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: hw_version
    name: "Hardware Version"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: sw_version
    name: "Software Version"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: device_name
    name: "Device Name"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: channel_info
    channel: 1
    name: "Test Zone Info"
