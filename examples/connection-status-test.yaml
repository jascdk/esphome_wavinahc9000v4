# Thermostat Connection Status Test Example
# This example shows how to monitor thermostat connection status

substitutions:
  device_name: wavin-connection-test
  friendly_name: Wavin Connection Status Test

esphome:
  name: ${device_name}

esp32:
  board: esp32dev

logger:
  level: DEBUG  # Enable DEBUG to see connection status in logs

api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Load the custom component
external_components:
  - source: github://jascdk/esphome_wavinahc9000v4
    components: [wavin_ahc9000]

# Configure UART for RS485
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN

# Configure the Wavin controller
wavin_ahc9000:
  id: wavin_controller
  uart_id: uart_bus
  update_interval: 5s
  tx_enable_pin: GPIO5

# Monitor thermostat connection status for multiple zones
binary_sensor:
  # Zone 1 thermostat connection
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: thermostat_connected
    name: "Zone 1 Thermostat Connected"
    # Optional: Create automations based on connection status
    # on_press:
    #   - logger.log: "Zone 1 thermostat connected!"
    # on_release:
    #   - logger.log: "Zone 1 thermostat disconnected!"
  
  # Zone 2 thermostat connection
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 2
    type: thermostat_connected
    name: "Zone 2 Thermostat Connected"
  
  # Zone 3 thermostat connection
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 3
    type: thermostat_connected
    name: "Zone 3 Thermostat Connected"

# Optional: Add climate entities to control the zones
climate:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Zone 1"
    channel: 1
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Zone 2"
    channel: 2
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Zone 3"
    channel: 3

# Optional: Add temperature sensors
sensor:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: temperature
    name: "Zone 1 Temperature"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 2
    type: temperature
    name: "Zone 2 Temperature"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 3
    type: temperature
    name: "Zone 3 Temperature"
