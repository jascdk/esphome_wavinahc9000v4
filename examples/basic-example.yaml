# Basic Wavin AHC-9000 ESPHome Configuration
# This example shows a minimal setup with a single zone

substitutions:
  device_name: wavin-heating
  friendly_name: Wavin Heating Controller

esphome:
  name: ${device_name}

esp32:
  board: esp32dev

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:

# Enable OTA updates
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Hotspot"
    password: "fallback123"

captive_portal:

# Load the custom component from GitHub
external_components:
  - source: github://jascdk/esphome_wavinahc9000v4
    components: [wavin_ahc9000]

# Configure UART for RS485 communication
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN

# Optional: Configure time component for clock synchronization
time:
  - platform: homeassistant
    id: ha_time

# Configure the Wavin AHC-9000 component
wavin_ahc9000:
  id: wavin_controller
  uart_id: uart_bus
  update_interval: 5s
  # Optional: GPIO pin to enable RS485 transmission (DE/RE pin on RS485 module)
  tx_enable_pin: GPIO5
  flow_control_pin: GPIO5
  # Optional: Clock synchronization with Home Assistant time
  time_id: ha_time
  sync_clock_on_connect: true
  clock_sync_interval: 24h
  
# Add climate control for zone 1 (Living Room)
climate:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Living Room"
    id: living_room_climate
    channel: 1

# Optional: Add hysteresis control for the climate entity (0.1-1.0°C)
# Adjusts the temperature deadband to prevent rapid heating on/off cycles
number:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    climate_id: living_room_climate
    name: "Living Room Hysteresis"
    type: hysteresis

# Optional: Add temperature sensor for zone 1
sensor:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: temperature
    name: "Living Room Temperature"
  
  # Optional: Add battery level sensor (for wireless thermostats)
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: battery
    name: "Living Room Battery"

# Optional: Add child lock switch
switch:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    name: "Living Room Child Lock"

# Optional: Device information text sensors
text_sensor:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: control_unit_address
    name: "Control Unit Address"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: hw_version
    name: "Hardware Version"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: sw_version
    name: "Software Version"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: device_name
    name: "Device Name"
