# Full Wavin AHC-9000 ESPHome Configuration
# This example shows all available features with multiple zones

substitutions:
  device_name: wavin-heating
  friendly_name: Wavin Heating Controller

esphome:
  name: ${device_name}

esp32:
  board: esp32dev

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:

# Enable OTA updates
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Hotspot"
    password: "fallback123"

captive_portal:

# Load the custom component from GitHub
external_components:
  - source: github://jascdk/esphome_wavinahc9000v4
    components: [wavin_ahc9000]

# Configure UART for RS485 communication
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN

# Configure the Wavin AHC-9000 component with all options
wavin_ahc9000:
  id: wavin_controller
  uart_id: uart_bus
  update_interval: 5s
  # RS485 control pins (connect to DE and RE on RS485 module)
  tx_enable_pin: GPIO5
  flow_control_pin: GPIO5
  # Advanced options
  temp_divisor: 10.0
  receive_timeout_ms: 1000
  poll_channels_per_cycle: 2
  allow_mode_writes: true
  # Optional: Set friendly names for channels
  channel_01_friendly_name: "Living Room"
  channel_02_friendly_name: "Kitchen"
  channel_03_friendly_name: "Bedroom 1"
  channel_04_friendly_name: "Bedroom 2"

# Climate entities for individual zones
climate:
  # Zone 1: Living Room
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Living Room"
    channel: 1
  
  # Zone 2: Kitchen
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Kitchen"
    channel: 2
    use_floor_temperature: true  # Use floor sensor for this zone
  
  # Zone 3: Bedroom 1
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Bedroom 1"
    channel: 3
  
  # Zone 4: Bedroom 2
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "Bedroom 2"
    channel: 4
  
  # Group climate: Control bedrooms together
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    name: "All Bedrooms"
    members: [3, 4]

# Temperature sensors
sensor:
  # Zone 1: Living Room sensors
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: temperature
    name: "Living Room Temperature"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: battery
    name: "Living Room Battery"
  
  # Zone 2: Kitchen sensors (with floor temperature)
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 2
    type: temperature
    name: "Kitchen Temperature"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 2
    type: floor_temperature
    name: "Kitchen Floor Temperature"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 2
    type: floor_min_temperature
    name: "Kitchen Floor Min Temperature"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 2
    type: floor_max_temperature
    name: "Kitchen Floor Max Temperature"
  
  # Zone 3: Bedroom 1 sensors
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 3
    type: temperature
    name: "Bedroom 1 Temperature"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 3
    type: battery
    name: "Bedroom 1 Battery"
  
  # Average temperature sensors
  # Example: Average temperature of all bedrooms
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: average_temperature
    members: [3, 4]  # Bedroom 1 and Bedroom 2
    name: "Bedrooms Average Temperature"
  
  # Example: Average temperature of entire house
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: average_temperature
    members: [1, 2, 3, 4]  # All zones
    name: "House Average Temperature"
  
  # Controller CPU temperature (diagnostic sensor)
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: cpu_temperature
    name: "Controller CPU Temperature"

# Child lock switches
switch:
  # Individual child lock switches
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 1
    type: child_lock
    name: "Living Room Child Lock"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 2
    type: child_lock
    name: "Kitchen Child Lock"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    channel: 3
    type: child_lock
    name: "Bedroom 1 Child Lock"
  
  # Group child lock: Control multiple zones with one switch
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: child_lock
    members: [1, 2, 3, 4]
    name: "Master Child Lock"

# Device information text sensors
text_sensor:
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: control_unit_address
    name: "Control Unit Address"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: hw_version
    name: "Hardware Version"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: sw_version
    name: "Software Version"
  
  - platform: wavin_ahc9000
    wavin_ahc9000_id: wavin_controller
    type: device_name
    name: "Device Name"
